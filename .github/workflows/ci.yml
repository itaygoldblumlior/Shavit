# CI: runs on every pull request and on every push to main.
# If any step fails, the PR shows a red ❌ and should not be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run of the same PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Code formatting (Prettier)
        run: npm run format:check

      - name: Unit tests (model, reminders, calendar, backups)
        run: npm run test:helper

      - name: Build the website
        run: npm run build

      - name: Build the app bundle and copy it into the iOS/Android projects
        run: npm run build:app && npx cap copy

      - name: Native storage tests and app configuration checks
        run: npm run app:check

      - name: Keep the website build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E tests (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the test browsers (Chromium and WebKit, Safari's engine)
        run: npx playwright install --with-deps chromium webkit

      - name: Run the E2E tests against the production build
        run: npm run test:e2e

      - name: Keep the test report (with traces of any failure)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
