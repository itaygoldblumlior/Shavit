<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0c1526" />
    <meta
      name="description"
      content="Your day, your workouts, your little wins. Shavit keeps it all on your device."
    />
    <title>Shavit — your cool friend</title>
    <link rel="icon" type="image/svg+xml" href="/helper-icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/shavit-180.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Paint the last-used theme before anything else, so the launch screen matches it.
      try {
        const t = localStorage.getItem('shavit-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="stylesheet" href="/themes.css" />
    <link rel="stylesheet" href="/helper.css" />
  </head>
  <body>
    <div id="launch" role="img" aria-label="Shavit is opening">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path
          d="M79 49c2 23-12 34-32 32S18 69 19 48 32 18 51 19s29 12 28 30Z M37 41l1 5 M62 40l1 5 M35 59q16 16 30-1"
        />
      </svg>
    </div>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="editor">
      <form id="editor-form">
        <header class="dialog-head">
          <h2 id="editor-title"></h2>
          <button type="button" id="close-editor" class="icon" aria-label="Close">×</button>
        </header>
        <div id="editor-content"></div>
        <p id="editor-error" role="alert"></p>
        <button class="primary" id="editor-save">Save</button>
      </form>
    </dialog>
    <input type="file" id="import-backup" accept="application/json,.json" hidden /><input
      type="file"
      id="import-notes"
      accept="text/plain,.txt"
      hidden
    />
    <script type="module" src="/entry.js"></script>
  </body>
</html>
